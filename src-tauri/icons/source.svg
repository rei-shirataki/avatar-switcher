<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B6BFF"/>
      <stop offset="1" stop-color="#4C3BCF"/>
    </linearGradient>
    <clipPath id="clip">
      <rect x="64" y="64" width="896" height="896" rx="220"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect x="64" y="64" width="896" height="896" rx="220" fill="url(#bg)"/>

    <!-- back avatar (cyan) -->
    <g fill="#2FE0E8">
      <rect x="130" y="600" width="440" height="330" rx="165"/>
      <circle cx="360" cy="430" r="155"/>
    </g>

    <!-- front avatar (white) -->
    <g fill="#FFFFFF">
      <rect x="420" y="640" width="480" height="360" rx="180"/>
      <circle cx="660" cy="470" r="175"/>
    </g>
  </g>
</svg>
