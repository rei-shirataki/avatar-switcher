name: 機能要望
description: こんな機能・改善が欲しい、という提案はこちら
labels: ["enhancement"]
body:
  - type: textarea
    id: background
    attributes:
      label: 背景・やりたいこと
      description: どんな場面で困っている／どうしたいかを教えてください。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案する変更
      description: 具体的な挙動のイメージがあれば記載してください（無くても構いません）。
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 代替案・検討したこと
    validations:
      required: false
