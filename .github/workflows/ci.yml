name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Type check (avatar-switcher)
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Type check (overlay-ui)
        run: npx tsc --noEmit -p projects/overlay-ui/tsconfig.app.json

      - name: Build frontend (avatar-switcher)
        run: npm run build

      - name: Build frontend (overlay-ui)
        run: npx ng build overlay-ui

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets
