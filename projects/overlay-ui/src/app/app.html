<div class="panel">
  <header class="panel__header">
    <h1>AvatarSwitcher</h1>
    @if (avatarService.loading()) {
      <span class="panel__status">読み込み中…</span>
    }
    <button type="button" class="sort-button" (click)="avatarService.cycleSortMode()">
      並び替え: {{ avatarService.sortLabel() }}
    </button>
  </header>
  <app-eye-height-control />
  <app-folder-tabs
    [folders]="avatarService.folders()"
    [selectedFolderId]="avatarService.selectedFolderId()"
    (select)="onSelectFolder($event)"
  />
  <app-avatar-grid
    [avatars]="avatarService.sortedAvatars()"
    [currentAvatarId]="avatarService.currentAvatarId()"
    [switchingId]="avatarService.switching()"
    (select)="onSelect($event)"
  />
</div>
